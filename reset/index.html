<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>uBUFF — Reset Password</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #e0e0e0;
      background: #0d0d0d;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: #161616;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 2rem 2.25rem;
    }
    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: #7c6af7;
      letter-spacing: 1.5px;
      text-align: center;
      margin-bottom: 0.25rem;
    }
    h1 {
      font-size: 1.25rem;
      color: #ffffff;
      text-align: center;
      margin-bottom: 1.75rem;
      font-weight: 500;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin: 1rem 0 0.35rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-size: 0.95rem;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e0e0e0;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus {
      border-color: #7c6af7;
    }
    button {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.75rem;
      background: #7c6af7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) {
      background: #9080ff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 1.25rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .msg.error {
      background: rgba(244, 68, 68, 0.1);
      border: 1px solid rgba(244, 68, 68, 0.3);
      color: #f88;
    }
    .msg.success {
      background: rgba(124, 106, 247, 0.1);
      border: 1px solid rgba(124, 106, 247, 0.3);
      color: #b8a8ff;
    }
    .hint {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.5rem;
      text-align: center;
    }
    .footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #2a2a4a;
      font-size: 0.75rem;
      color: #555;
      text-align: center;
    }
    .footer a { color: #7c6af7; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">uBUFF</div>
    <h1>Reset your password</h1>

    <form id="reset-form">
      <label for="pw1">New password</label>
      <input type="password" id="pw1" autocomplete="new-password" required minlength="8" />

      <label for="pw2">Confirm new password</label>
      <input type="password" id="pw2" autocomplete="new-password" required minlength="8" />

      <button type="submit" id="submit-btn">Set new password</button>
      <div class="hint">Minimum 8 characters</div>
    </form>

    <div id="msg" class="msg"></div>

    <div class="footer">
      Need help? Contact <a href="mailto:ubuff.official@gmail.com">ubuff.official@gmail.com</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rbuiiwrgybtwnxnndmah.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJidWlpd3JneWJ0d254bm5kbWFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTE4ODEsImV4cCI6MjA5MDQ2Nzg4MX0.KSYnCy7yzBsElAedYh7_YF7iNtN76c990kPQzuhY2IE';

    function parseHash() {
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      return {
        access_token: params.get('access_token'),
        refresh_token: params.get('refresh_token'),
        type: params.get('type'),
        error: params.get('error'),
        error_description: params.get('error_description'),
      };
    }

    const msg = document.getElementById('msg');
    const form = document.getElementById('reset-form');
    const btn = document.getElementById('submit-btn');
    const pw1 = document.getElementById('pw1');
    const pw2 = document.getElementById('pw2');

    function showMsg(text, kind) {
      msg.textContent = text;
      msg.className = 'msg ' + kind;
      msg.style.display = 'block';
    }

    const tokens = parseHash();

    if (tokens.error) {
      showMsg(tokens.error_description || tokens.error, 'error');
      btn.disabled = true;
    } else if (!tokens.access_token || tokens.type !== 'recovery') {
      showMsg('Invalid or expired reset link. Request a new one from the uBUFF app.', 'error');
      btn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none';

      if (pw1.value !== pw2.value) {
        showMsg('Passwords do not match.', 'error');
        return;
      }
      if (pw1.value.length < 8) {
        showMsg('Password must be at least 8 characters.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${tokens.access_token}`,
            'apikey': SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ password: pw1.value }),
        });

        if (response.ok) {
          showMsg('Password updated. You can now sign in to uBUFF with your new password.', 'success');
          form.style.display = 'none';
        } else {
          const data = await response.json().catch(() => ({}));
          showMsg(data.msg || data.error_description || 'Update failed — please try again or request a fresh reset link.', 'error');
          btn.disabled = false;
          btn.textContent = 'Set new password';
        }
      } catch (err) {
        showMsg('Network error — please check your connection and try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    });
  </script>
</body>
</html>
